<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lakita Ingole | Aspiring AI/ML Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060d;--acc:#ff8a3d;--ink:#efe6dc;--mut:rgba(239,230,220,.55);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%),linear-gradient(#000 0,transparent 9%,transparent 91%,#000 100%)}
.bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;width:min(560px,calc(100% - 24px));box-sizing:border-box;padding:12px 14px;border-radius:14px;background:rgba(10,13,22,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);display:grid;gap:10px;transition:opacity .4s,transform .4s}
.bar.off{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
.row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.row>span{width:46px;flex:none}
.seg{display:flex;flex:1;background:rgba(255,255,255,.05);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:500 12px/1 inherit;font-family:inherit;padding:8px 4px;border-radius:7px;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.12);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--acc)}
.val{width:34px;text-align:right;font-variant-numeric:tabular-nums}
.pg{display:flex;gap:8px;justify-content:center}
.pg button{width:30px;height:3px;border:0;padding:0;border-radius:2px;background:rgba(255,255,255,.2);cursor:pointer;position:relative;overflow:hidden}
.pg button i{position:absolute;inset:0;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.pg button.on i{transform:scaleX(1)}
.tg{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:4;border:1px solid rgba(255,255,255,.12);background:rgba(10,13,22,.5);color:var(--mut);font:500 12px/1 Manrope,system-ui,sans-serif;padding:9px 12px;border-radius:9px;cursor:pointer}
</style></head><body>
<canvas id="c" aria-label="Lakita Ingole professional portfolio portrait sequence"></canvas>
<div class="vig"></div>
<button class="tg" id="tg" aria-expanded="true">Hide controls</button>

 <div class="pg" id="pg"></div>
</div>

const N=3,GAP=7.5,H=5.2,HOLD=4.8;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STYLES=[['dolly','Fly-through'],['orbit','Orbit'],['depth','Depth']];
const MOODS={ember:{n:'Ember',sat:1.05,tint:[1,1,1],con:1.05,acc:0xff8a3d,bg:0x04060d,sw:[1,.55,.2]},

 mono:{n:'Mono',sat:.06,tint:[1.06,1,.94],con:1.14,acc:0xe8dccb,bg:0x050505,sw:[1,.95,.85]}};
let style='dolly',mood='ember',speed=1,paused=false;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x04060d,0.04);scene.background=new THREE.Color(0x04060d);
const cam=new THREE.PerspectiveCamera(38,1,.1,80);
const PX=[0,-.9,.9],RY=[0,.22,-.2];
const vs='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const fs=`uniform sampler2D map;uniform float op,t,zoom,sat,con;uniform vec3 tint,sw;varying vec2 vUv;
void main(){vec2 uv=(vUv-.5)/zoom+.5;vec3 c=texture2D(map,uv).rgb;

 vec2 e=smoothstep(0.,.14,vUv)*smoothstep(0.,.14,1.-vUv);
 gl_FragColor=vec4(c,e.x*e.y*op);}`;
const planes=[],loader=new THREE.TextureLoader();
for(let i=0;i<N;i++){
 const w=H*ASPECT[i][0]/ASPECT[i][1],tex=loader.load(SRC[i]);tex.minFilter=THREE.LinearFilter;
 const mat=new THREE.ShaderMaterial({vertexShader:vs,fragmentShader:fs,transparent:true,depthWrite:false,
  uniforms:{map:{value:tex},op:{value:0},t:{value:0},zoom:{value:1},sat:{value:1},con:{value:1},tint:{value:new THREE.Vector3(1,1,1)},sw:{value:new THREE.Vector3(1,.5,.2)}}});
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,H),mat);scene.add(m);planes.push(m);
}
const PC=420,pg=new THREE.BufferGeometry(),pp=new Float32Array(PC*3),ps=new Float32Array(PC);
for(let i=0;i<PC;i++){pp[i*3]=(Math.random()-.5)*16;pp[i*3+1]=(Math.random()-.5)*9;pp[i*3+2]=8-Math.random()*(N*GAP+10);ps[i]=.2+Math.random()}

function setMood(k){mood=k;document.querySelectorAll('#mood button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
 document.documentElement.style.setProperty('--acc','#'+new THREE.Color(MOODS[k].acc).getHexString())}
function easeGrade(){const m=MOODS[mood],a=reduce?1:.05;
 cur.sat+=(m.sat-cur.sat)*a;cur.con+=(m.con-cur.con)*a;
 cur.tint.lerp(new THREE.Vector3(...m.tint),a);cur.sw.lerp(new THREE.Vector3(...m.sw),a);
 cur.acc.lerp(new THREE.Color(m.acc),a);cur.bg.lerp(new THREE.Color(m.bg),a);
 scene.background.copy(cur.bg);scene.fog.color.copy(cur.bg);pm.color.copy(cur.acc);

STYLES.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.setAttribute('aria-pressed',k===style);

const spd=document.getElementById('spd'),sv=document.getElementById('sv');

const bar=document.getElementById('bar'),tg=document.getElementById('tg');
function toggle(){const off=bar.classList.toggle('off');tg.textContent=off?'Show controls':'Hide controls';tg.setAttribute('aria-expanded',!off)}

// state
let idx=0,s=0,vel=0,idle=0,last=performance.now(),clock=0,mx=0,my=0,tmx=0,tmy=0;
function goTo(i){ // shortest direction in carousel styles
 if(style==='dolly'){idx=i}else{const cur=((idx%N)+N)%N;let d=i-cur;if(d>N/2)d-=N;if(d<-N/2)d+=N;idx+=d}idle=0}
function step(d){if(style==='dolly')idx=(((idx+d)%N)+N)%N;else idx+=d;idle=0}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<.8?54:38;cam.updateProjectionMatrix()}

addEventListener('pointermove',e=>{tmx=e.clientX/innerWidth-.5;tmy=e.clientY/innerHeight-.5});

addEventListener('pointerup',e=>{if(sx===null)return;const d=e.clientX-sx;sx=null;step(Math.abs(d)>40?(d<0?1:-1):1)});

addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')step(1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')step(-1);else if(e.key==='h'||e.key==='H')toggle();else if(e.key===' '){paused=!paused;e.preventDefault()}});

  const sc=THREE.MathUtils.clamp(s,0,N-1),f=Math.floor(Math.min(sc,N-1-1e-4)),fr=sstep(sc-f),nx=Math.min(f+1,N-1);

  planes.forEach((p,i)=>{p.position.set(PX[i],Math.sin(clock*.5+i*2)*.05,-i*GAP);p.rotation.set(0,RY[i],0);

  cam.position.set(px*.55+mx*.9+Math.sin(clock*.25)*.18,-my*.5+Math.cos(clock*.21)*.1,z+Math.sin(clock*.3)*.12);
  cam.lookAt(px*.8+mx*.4,0,z-6);cam.rotation.z+=Math.sin(clock*.2)*.012-vel*.012;
 }else if(style==='orbit'){
  const R=7.5;
  planes.forEach((p,i)=>{let d=i-s;d-=N*Math.round(d/N);const th=d*2*Math.PI/N;
   p.position.set(Math.sin(th)*R,Math.sin(clock*.5+i)*.06,Math.cos(th)*R-R);p.rotation.set(0,th,0);
   p.material.uniforms.op.value=sm(Math.cos(th),.1,.8)});
  const a=Math.sin(clock*.2)*.06;
  cam.position.set(mx*1.4+Math.sin(a)*2,-my*.6+.2,6.6+Math.cos(a));cam.lookAt(0,0,-.5);cam.rotation.z+=-vel*.01;
 }else{
  planes.forEach((p,i)=>{let d=i-s;d-=N*Math.round(d/N);const a=Math.abs(d);
   p.position.set(d*2.2,Math.sin(clock*.5+i)*.05,-a*1.6);p.rotation.set(0,-d*.4,0);
   p.material.uniforms.op.value=1-sm(a,.25,.95)});
  cam.position.set(mx*.7,-my*.4,6.4+Math.sin(clock*.25)*.25);cam.lookAt(0,0,0);cam.rotation.z+=Math.sin(clock*.2)*.008;
 }
 planes.forEach((p,i)=>{const u=p.material.uniforms;u.t.value=clock;u.zoom.value=1.04+Math.sin(clock*.18+i)*.02});
 const a=pg.attributes.position.array;
 for(let i=0;i<PC;i++){a[i*3+1]+=ps[i]*dt*speed*.35;a[i*3]+=Math.sin(clock*.4+i)*dt*.04;if(a[i*3+1]>4.6)a[i*3+1]=-4.6}

 easeGrade();renderer.render(scene,cam);requestAnimationFrame(frame)}
